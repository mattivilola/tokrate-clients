name: Windows and Linux clients
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: windows-x64
          - os: ubuntu-22.04
            bundles: deb,appimage
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          workspaces: |
            desktop/core
            desktop/src-tauri
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf xvfb dbus-x11
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo test --locked --manifest-path desktop/core/Cargo.toml
      - run: cargo test --locked --release --features custom-protocol --manifest-path desktop/src-tauri/Cargo.toml
      - name: Build platform installers
        id: bundle_release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            npm run tauri -- build --features custom-protocol --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.conf.json
            echo "flavor=signed" >> "$GITHUB_OUTPUT"
          else
            npm run tauri -- build --features custom-protocol --bundles ${{ matrix.bundles }}
            echo "flavor=unsigned-test-build" >> "$GITHUB_OUTPUT"
          fi
        working-directory: desktop
      - name: Build unsigned pull-request test installers
        id: bundle_pr
        if: github.event_name == 'pull_request'
        run: |
          npm run tauri -- build --features custom-protocol --bundles ${{ matrix.bundles }}
          echo "flavor=unsigned-test-build" >> "$GITHUB_OUTPUT"
        working-directory: desktop
      - name: Linux native webview smoke
        id: linux_smoke
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          TOKRATE_SMOKE_DIAGNOSTIC: ${{ runner.temp }}/tokrate-native-smoke-${{ matrix.artifact }}.json
        run: xvfb-run -a dbus-run-session -- python3 desktop/scripts/native-smoke.py desktop/src-tauri/target/release/tokrate-desktop
      - name: Windows native webview smoke
        id: windows_smoke
        if: runner.os == 'Windows'
        env:
          TOKRATE_SMOKE_DIAGNOSTIC: ${{ runner.temp }}/tokrate-native-smoke-${{ matrix.artifact }}.json
        run: python desktop/scripts/native-smoke.py desktop/src-tauri/target/release/tokrate-desktop.exe
      - name: Upload native installer packages
        if: always() && (steps.bundle_release.outcome == 'success' || steps.bundle_pr.outcome == 'success')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tokrate-0.1.22-${{ matrix.artifact }}-${{ steps.bundle_release.outputs.flavor || steps.bundle_pr.outputs.flavor }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*
            desktop/src-tauri/target/release/bundle/deb/*
            desktop/src-tauri/target/release/bundle/appimage/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload native smoke diagnostics
        if: always() && (steps.linux_smoke.outcome == 'failure' || steps.windows_smoke.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tokrate-native-smoke-diagnostics-${{ matrix.artifact }}
          path: ${{ runner.temp }}/tokrate-native-smoke-${{ matrix.artifact }}.json
          if-no-files-found: warn
          retention-days: 7
