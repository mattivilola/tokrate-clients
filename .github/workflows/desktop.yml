name: Windows and Linux clients
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: windows-x64
          - os: ubuntu-22.04
            bundles: deb,appimage
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/core
            desktop/src-tauri
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf xvfb dbus-x11
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo test --locked --manifest-path desktop/core/Cargo.toml
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Build platform installers
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
        working-directory: desktop
      - name: Linux native webview smoke
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: xvfb-run -a dbus-run-session -- python3 desktop/scripts/native-smoke.py desktop/src-tauri/target/release/tokrate-desktop
      - name: Windows native webview smoke
        if: runner.os == 'Windows'
        run: python desktop/scripts/native-smoke.py desktop/src-tauri/target/release/tokrate-desktop.exe
      - uses: actions/upload-artifact@v4
        with:
          name: tokrate-0.1.8-${{ matrix.artifact }}-unsigned-test-build
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
