name: Windows and Linux clients
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: windows-x64
          - os: ubuntu-22.04
            bundles: deb,appimage
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            desktop/core
            desktop/src-tauri
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf xvfb dbus-x11
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo test --locked --manifest-path desktop/core/Cargo.toml
      - run: cargo test --locked --release --features custom-protocol --manifest-path desktop/src-tauri/Cargo.toml
      - name: Build platform installers
        id: bundle_release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            npm run tauri -- build --features custom-protocol --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.conf.json
            echo "flavor=signed" >> "$GITHUB_OUTPUT"
          else
            npm run tauri -- build --features custom-protocol --bundles ${{ matrix.bundles }}
            echo "flavor=unsigned-test-build" >> "$GITHUB_OUTPUT"
          fi
        working-directory: desktop
      - name: Build unsigned pull-request test installers
        id: bundle_pr
        if: github.event_name == 'pull_request'
        run: |
          npm run tauri -- build --features custom-protocol --bundles ${{ matrix.bundles }}
          echo "flavor=unsigned-test-build" >> "$GITHUB_OUTPUT"
        working-directory: desktop
      - name: Linux native webview smoke
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: xvfb-run -a dbus-run-session -- python3 desktop/scripts/native-smoke.py desktop/src-tauri/target/release/tokrate-desktop
      - name: Windows native webview smoke
        if: runner.os == 'Windows'
        run: python desktop/scripts/native-smoke.py desktop/src-tauri/target/release/tokrate-desktop.exe
      - uses: actions/upload-artifact@v4
        with:
          name: tokrate-0.1.15-${{ matrix.artifact }}-${{ steps.bundle_release.outputs.flavor || steps.bundle_pr.outputs.flavor }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*
            desktop/src-tauri/target/release/bundle/deb/*
            desktop/src-tauri/target/release/bundle/appimage/*
          if-no-files-found: error
          retention-days: 7
