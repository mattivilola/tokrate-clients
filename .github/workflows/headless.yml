name: Debian headless client
on:
  push:
    branches: [main]
    paths:
      - 'linux/headless/**'
      - 'linux/README.md'
      - 'desktop/core/**'
      - 'desktop/src-tauri/src/**'
      - '.github/workflows/headless.yml'
      - 'release/**'
  pull_request:
    paths:
      - 'linux/headless/**'
      - 'linux/README.md'
      - 'desktop/core/**'
      - 'desktop/src-tauri/src/**'
      - '.github/workflows/headless.yml'
      - 'release/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: headless-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debian:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    container: debian:12
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl dpkg-dev minisign passwd python3 systemd util-linux
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          workspaces: |
            linux/headless
            desktop/core
      - name: Check installer and systemd integration
        run: python3 linux/headless/test-install.py
      - name: Test shared Rust core
        run: cargo test --locked --manifest-path desktop/core/Cargo.toml
      - name: Test and build headless binary
        run: |
          cargo test --locked --manifest-path linux/headless/Cargo.toml
          cargo build --locked --release --manifest-path linux/headless/Cargo.toml
          install -D linux/headless/target/release/tokrate-headless /usr/bin/tokrate-headless
      - name: Verify systemd units and encrypted credential flow
        run: |
          install -D -m 0644 linux/headless/tokrate-update.sysusers /usr/lib/sysusers.d/tokrate-update.conf
          install -D -m 0755 linux/headless/provision-update-user.sh /usr/libexec/tokrate-headless/provision-update-user
          /usr/libexec/tokrate-headless/provision-update-user
          systemd-analyze verify linux/headless/tokrate-headless-local@.service linux/headless/tokrate-headless-share@.service linux/headless/tokrate-headless-update-check.service linux/headless/tokrate-headless-update-check.timer
          python3 linux/headless/test-runtime.py linux/headless/target/release/tokrate-headless
          TOKRATE_HEADLESS_RUN_INSTALL_TEST=1 TOKRATE_HEADLESS_BINARY=/usr/bin/tokrate-headless python3 linux/headless/test-install.py
      - name: Build Debian package
        run: linux/headless/package.sh "$RUNNER_TEMP/tokrate-headless-deb"
      - name: Prepare bootstrap release archive
        run: |
          bundle_root="$RUNNER_TEMP/headless-bundle"
          install -d -m 0755 "$bundle_root/tokrate-headless"
          install -m 0755 /usr/bin/tokrate-headless "$bundle_root/tokrate-headless/tokrate-headless"
          install -m 0755 linux/headless/install.sh "$bundle_root/tokrate-headless/install.sh"
          install -m 0644 linux/headless/tokrate-headless-local@.service "$bundle_root/tokrate-headless/tokrate-headless-local@.service"
          install -m 0644 linux/headless/tokrate-headless-share@.service "$bundle_root/tokrate-headless/tokrate-headless-share@.service"
          install -m 0644 linux/headless/tokrate-headless-update-check.service "$bundle_root/tokrate-headless/tokrate-headless-update-check.service"
          install -m 0644 linux/headless/tokrate-headless-update-check.timer "$bundle_root/tokrate-headless/tokrate-headless-update-check.timer"
          install -m 0644 linux/headless/tokrate-update.sysusers "$bundle_root/tokrate-headless/tokrate-update.sysusers"
          install -m 0755 linux/headless/provision-update-user.sh "$bundle_root/tokrate-headless/provision-update-user.sh"
          architecture=$(dpkg --print-architecture)
          tar --create --gzip --file "$RUNNER_TEMP/tokrate-headless_0.1.28_${architecture}.tar.gz" --directory "$bundle_root" tokrate-headless
      - name: Sign and verify release artifacts
        if: github.event_name != 'pull_request'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          node -e 'process.stdout.write(Buffer.from(require("./desktop/src-tauri/tauri.conf.json").plugins.updater.pubkey,"base64"))' > "$RUNNER_TEMP/tokrate-public-key.pub"
          for artifact in "$RUNNER_TEMP"/tokrate-headless-deb/*.deb "$RUNNER_TEMP"/tokrate-headless_*.tar.gz; do
            npm exec --yes --package @tauri-apps/cli@2.12.1 -- tauri signer sign --app-version 0.1.28 "$artifact"
            base64 --decode "$artifact.sig" > "$artifact.minisig"
            minisign -Vm "$artifact" -p "$RUNNER_TEMP/tokrate-public-key.pub" -x "$artifact.minisig"
          done
      - name: Collect complete release assets
        id: release_assets
        run: |
          destination="$RUNNER_TEMP/headless-release"
          install -d "$destination"
          cp "$RUNNER_TEMP"/tokrate-headless-deb/*.deb* "$destination/"
          cp "$RUNNER_TEMP"/tokrate-headless_*.tar.gz* "$destination/"
          test -s "$destination/tokrate-headless_0.1.28_$(dpkg --print-architecture).tar.gz"
          echo "path=$destination" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tokrate-headless-debian12-${{ runner.arch }}
          path: ${{ steps.release_assets.outputs.path }}
          if-no-files-found: error
          retention-days: 7
  runtime-debian12:
    needs: debian
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tokrate-headless-debian12-*
          path: ${{ runner.temp }}/headless-runtime-artifacts
          merge-multiple: true
      - name: Build privileged Debian 12 systemd test image
        run: docker build --file linux/headless/runtime-test.Dockerfile --tag tokrate-headless-runtime-test:debian12 linux/headless
      - name: Run real Debian 12 package and systemd lifecycle tests
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/headless-runtime-artifacts
        run: |
          deb=$(find "$ARTIFACT_DIR" -maxdepth 1 -type f -name 'tokrate-headless_*_amd64.deb' -print -quit)
          test -n "$deb"
          name=tokrate-headless-systemd-runtime
          docker run --detach --privileged --cgroupns=host --name "$name" \
            --mount type=bind,src=/sys/fs/cgroup,dst=/sys/fs/cgroup \
            --tmpfs /run --tmpfs /run/lock --tmpfs /tmp \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --env container=docker \
            tokrate-headless-runtime-test:debian12
          trap 'docker rm --force "$name" >/dev/null 2>&1 || true' EXIT
          # Wait for boot-time tmpfiles cleanup before staging test inputs.
          docker exec "$name" systemctl is-system-running --wait || {
            state=$(docker exec "$name" systemctl is-system-running || true)
            test "$state" = degraded
          }
          docker cp "$deb" "$name:/root/tokrate-headless.deb"
          docker exec "$name" test -f /root/tokrate-headless.deb
          docker exec "$name" python3 /work/linux/headless/test-systemd-runtime.py /root/tokrate-headless.deb /work/linux/headless
  signed-feed:
    needs: debian
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tokrate-headless-debian12-*
          path: headless-release-assets
          merge-multiple: true
      - name: Validate release manifest generation
        run: node --test release/*.test.mjs
      - name: Bind both native packages and sign the update feed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          destination="$RUNNER_TEMP/headless-signed-feed"
          install -d "$destination"
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          node release/headless-manifest.mjs create 0.1.28 headless-release-assets "$destination/headless-alpha.payload.json"
          npm exec --yes --package @tauri-apps/cli@2.12.1 -- tauri signer sign --app-version 0.1.28 "$destination/headless-alpha.payload.json"
          node release/headless-manifest.mjs wrap "$destination/headless-alpha.payload.json" "$destination/headless-alpha.payload.json.sig" "$destination/alpha.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tokrate-headless-0.1.28-signed-feed
          path: ${{ runner.temp }}/headless-signed-feed/*
          if-no-files-found: error
          retention-days: 7
