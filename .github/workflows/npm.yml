name: npm CLI package
on:
  push:
    branches: [main]
    paths: ['cli/**', 'package.json', 'package-lock.json', 'README.md', 'LICENSE', 'linux/headless/bootstrap.sh', '.github/workflows/npm.yml']
  pull_request:
    paths: ['cli/**', 'package.json', 'package-lock.json', 'README.md', 'LICENSE', 'linux/headless/bootstrap.sh', '.github/workflows/npm.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:package
