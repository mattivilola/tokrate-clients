[package]
name = "tokrate-core"
version = "0.1.20"
edition = "2021"
license = "MIT"
description = "Portable local metrics and privacy-preserving sharing core for Tokrate"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "2"
rand = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
